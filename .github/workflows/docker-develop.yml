name: Build and publish test image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: openrepairdb-develop-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/spencerandhillai/openrepairdb:develop
            ghcr.io/spencerandhillai/openrepairdb:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push PostgreSQL image with initial schema
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.postgres
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/spencerandhillai/openrepairdb-postgres:develop
            ghcr.io/spencerandhillai/openrepairdb-postgres:sha-${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
